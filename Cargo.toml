[workspace]
members = [
    "src-tauri",
    "dpi-core"
]
resolver = "2"

[profile.release]
lto = "thin"        # Link-Time Optimization — odstraní mrtvý kód
opt-level = "z"     # Optimalizace na velikost
codegen-units = 1   # Lepší deduplikace kódu
panic = "abort"     # Odstraní unwinding tabulky
strip = true        # Strip debug symbolů
