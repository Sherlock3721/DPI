name: Windows Release

# Spustí se po pushnutí tagu vX.Y.Z (release.sh to dělá automaticky).
# Linux build a upload probíhá lokálně přes release.sh.
# Tento workflow přidá Windows NSIS bundle a aktualizuje latest.json.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (napr. v1.7.2)'
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows NSIS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # ── Najdi artefakty ──────────────────────────────────────────────────────
      - name: Locate Windows artifacts
        id: win
        shell: bash
        run: |
          ZIP=$(find target/release/bundle/nsis -name "*.nsis.zip" | head -1)
          SIG=$(find target/release/bundle/nsis -name "*.nsis.zip.sig" | head -1)
          EXE=$(find target/release/bundle/nsis -name "*-setup.exe" | head -1)
          if [ -z "$ZIP" ] || [ -z "$SIG" ] || [ -z "$EXE" ]; then
            echo "❌ Nenalezeny NSIS artefakty:"
            find target/release/bundle/ -type f | head -20
            exit 1
          fi
          echo "zip=$ZIP"     >> $GITHUB_OUTPUT
          echo "sig=$SIG"     >> $GITHUB_OUTPUT
          echo "exe=$EXE"     >> $GITHUB_OUTPUT
          echo "zip_name=$(basename "$ZIP")" >> $GITHUB_OUTPUT
          echo "✅ ZIP: $ZIP"
          echo "✅ SIG: $SIG"
          echo "✅ EXE: $EXE"

      # ── Počkej na GitHub release (vytváří ho release.sh) ─────────────────────
      - name: Wait for GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG}"
          echo "Čekám na release $TAG..."
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
              echo "✅ Release $TAG nalezen (pokus $i)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "⚠️  Release $TAG nebyl nalezen po 10 minutách — vytvářím prázdný."
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Droplet Printing Interface $TAG" \
                --notes "Automatické vydání $TAG."
            fi
            sleep 10
          done

      # ── Stáhni latest.json, přidej windows-x86_64, nahraj zpět ──────────────
      - name: Merge Windows platform into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG}"
          ZIP_NAME="${{ steps.win.outputs.zip_name }}"
          WIN_SIG=$(cat "${{ steps.win.outputs.sig }}")
          WIN_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/${ZIP_NAME// /.}"
          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)")

          # Stáhni existující latest.json (z Linux buildu)
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --dir /tmp/ \
            --clobber 2>/dev/null || true

          # Vytvoř latest.json pokud neexistuje (Linux build ho nevytvořil)
          if [ ! -f /tmp/latest.json ]; then
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            printf '{"version":"%s","notes":"Verze %s","pub_date":"%s","platforms":{}}' \
              "$VERSION" "$VERSION" "$PUB_DATE" > /tmp/latest.json
          fi

          # Přidej windows-x86_64 platformu pomocí jq
          jq --arg sig "$WIN_SIG" --arg url "$WIN_URL" \
            '.platforms["windows-x86_64"] = {"signature": $sig, "url": $url}' \
            /tmp/latest.json > /tmp/latest_new.json
          mv /tmp/latest_new.json /tmp/latest.json
          cat /tmp/latest.json

      # ── Nahraj vše do GitHub release ─────────────────────────────────────────
      - name: Upload Windows artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ steps.win.outputs.zip }}" \
            "${{ steps.win.outputs.sig }}" \
            "${{ steps.win.outputs.exe }}" \
            /tmp/latest.json
          echo "✅ Windows artefakty nahrány do release $TAG."
          echo "   https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
