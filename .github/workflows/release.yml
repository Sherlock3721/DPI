name: Windows Release

# Spustí se po pushnutí tagu vX.Y.Z (release.sh to dělá automaticky).
# release.sh lokálně vytváří a podepisuje STORED zip + latest.json.
# Tento workflow přidá Windows .exe jako přímý download pro uživatele.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (napr. v1.7.2)'
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 target pro wasm-pack build dpi-core (beforeBuildCommand)
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows NSIS bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # ── Najdi .exe ────────────────────────────────────────────────────────────
      - name: Locate Windows exe
        id: win
        shell: bash
        run: |
          EXE=$(find target/release/bundle/nsis -name "*-setup.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "❌ Nenalezeno .exe v target/release/bundle/nsis:"
            find target/release/bundle/ -type f | head -20
            exit 1
          fi
          echo "exe=$EXE" >> $GITHUB_OUTPUT
          echo "✅ EXE: $EXE"

      # ── Počkej na GitHub release (vytváří ho release.sh) ─────────────────────
      - name: Wait for GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG}"
          echo "Čekám na release $TAG..."
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
              echo "✅ Release $TAG nalezen (pokus $i)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "⚠️  Release $TAG nebyl nalezen po 10 minutách — vytvářím prázdný."
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Droplet Printing Interface $TAG" \
                --notes "Automatické vydání $TAG."
            fi
            sleep 10
          done

      # ── Nahraj .exe do GitHub release ────────────────────────────────────────
      - name: Upload Windows exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ steps.win.outputs.exe }}"
          echo "✅ Windows .exe nahrán do release $TAG."
          echo "   https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
