name: CI

# Testy a lint na každý push/PR do main. Release buildy řeší release.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Systémové závislosti Tauri v2 na Linuxu (webkit2gtk) + libudev (serialport)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libudev-dev libssl-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust build cache
        uses: swatinem/rust-cache@v2

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable, wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dpi-core

      - name: Install npm dependencies
        run: npm ci

      # svelte-check potřebuje vygenerovaný WASM modul (src/wasm je gitignorovaný)
      - name: Build dpi-core WASM
        run: npm run wasm:build

      - name: svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json
