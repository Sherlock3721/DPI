[package]
name = "dpi-render"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
# Nativní offscreen (src-tauri): Vulkan / GL / DX12, blokující čekání přes pollster.
native = [
    "wgpu/std",
    "wgpu/parking_lot",
    "wgpu/vulkan",
    "wgpu/gles",
    "wgpu/dx12",
    "wgpu/wgsl",
    "dep:pollster",
]
# Wasm nad WebGL2 přímo v plátně (wasm-pack, --no-default-features --features wasm).
wasm = [
    "wgpu/std",
    "wgpu/webgl",
    "wgpu/wgsl",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:js-sys",
]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pollster = { version = "1.0.1", optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
wasm-bindgen-futures = { version = "0.4.77", optional = true }
web-sys = { version = "0.3.104", optional = true, features = ["HtmlCanvasElement"] }
js-sys = { version = "0.3.104", optional = true }

[dev-dependencies]
png = "0.18"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
